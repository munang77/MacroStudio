    material: CHEST
    rarity: rare
    price: 15000
  ender_backpack:
    name: "&5엔더 가방"
    material: ENDER_CHEST
    rarity: epic
    price: 40000
  barrel_backpack:
    name: "&e나무통 가방"
    material: BARREL
    price: 8000
  beehive_backpack:
    name: "&e벌집 가방"
    material: BEEHIVE
    rarity: rare

# ── 풍선 : 줄에 매달려 머리 위에서 흔들리는 풍선
#   string  줄로 쓸 블록 (none 이면 줄 없음, 기본 WHITE_WOOL)
