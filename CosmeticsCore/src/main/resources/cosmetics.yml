# ── 킬 이펙트 : 상대를 처치한 자리에서 터지는 효과
#   effect  LIGHTNING(번개) FIREWORK(폭죽) BURST(파티클 폭발)
#   FIREWORK : colors, fade-colors, firework-type(BALL, BALL_LARGE, STAR, BURST, CREEPER)
#   BURST    : particle, amount, spread, speed
#   sound    : 함께 재생할 소리 키 (선택), volume, pitch
kill-effects:
  lightning:
    name: "&e번개"
    icon: LIGHTNING_ROD
    effect: LIGHTNING
    rarity: epic
  firework:
    name: "&c불꽃놀이"
    icon: FIREWORK_ROCKET
    effect: FIREWORK
    firework-type: BALL_LARGE
    colors: ["#FF5252", "#FFD740"]
    fade-colors: ["#FFFFFF"]
    free: true
  blood:
    name: "&4피 튀기기"
    icon: REDSTONE
    effect: BURST
    particle: BLOCK
    block: REDSTONE_BLOCK
    amount: 60
    spread: 0.4
    speed: 0.1
  totem:
    name: "&6불사의 토템"
    icon: TOTEM_OF_UNDYING
    effect: BURST
    particle: TOTEM_OF_UNDYING
    amount: 80
    spread: 0.3
    speed: 0.5
    sound: item.totem.use
    volume: 0.6
    rarity: legendary
  heart_burst:
