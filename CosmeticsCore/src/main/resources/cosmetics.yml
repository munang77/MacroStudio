# ─────────────────────────────────────────────
#  CosmeticsCore 코스메틱 목록
#
#  아이디(예: crown)는 모든 카테고리를 통틀어 겹치면 안 됩니다 (영문 소문자, 숫자, _, -).
#
#  공통 항목
#    name        메뉴에 보일 이름 (&색코드, &#RRGGBB 지원)
#    lore        메뉴 설명 줄 목록
#    icon        메뉴 아이콘 아이템 (모자/백팩/풍선/펫은 생략하면 그 아이템 모양 그대로)
#    icon-model-data / icon-item-model / icon-texture   아이콘 리소스팩 모델, 머리 텍스처
#    rarity      등급 (config.yml 의 rarities: common, rare, epic, legendary)
#    price       가격. 0 보다 크면 메뉴에서 Vault 돈으로 살 수 있습니다
#    free        true 면 누구나 사용 (기본 false)
#    crate       false 면 뽑기에서 안 나옵니다 (기본: free 가 아니면 나옴)
#    permission  사용 권한 (기본 cosmeticscore.cosmetic.<아이디>)
#
#  사용 조건: free 이거나, 권한이 있거나, 지급/구매/뽑기로 얻었거나
#  OP 는 cosmeticscore.cosmetic.all 로 전부 쓸 수 있습니다.
#
#  아이템 모양 (모자·백팩·풍선·펫)
#    material           아이템 이름
#    custom-model-data  리소스팩 모델 번호
#    item-model         1.21.2+ 아이템 모델 키, 예: "myserver:crown"
#    texture            플레이어 머리 텍스처 (textures.minecraft.net 주소, 해시, 또는 base64 Value)
#                       texture 만 적으면 material 은 자동으로 PLAYER_HEAD
#
#  파티클 이름은 https://jd.papermc.io/paper/org/bukkit/Particle.html 참고
#    DUST 계열은 color("#RRGGBB"), size 를 쓰고, rainbow: true 면 무지개색으로 바뀝니다
#    BLOCK 계열은 block: REDSTONE_BLOCK 처럼 블록을 적습니다
# ─────────────────────────────────────────────

# ── 모자 : 머리 칸에 씌워지는 장식 아이템 (방어력 없음, 벗기거나 버릴 수 없음)
hats:
  crown:
    name: "&6&l왕관"
    lore:
      - "&7반짝이는 황금 왕관"
    material: GOLDEN_HELMET
    rarity: epic
    price: 30000
  pumpkin_head:
    name: "&6호박 머리"
    lore:
      - "&7할로윈 분위기"
    material: CARVED_PUMPKIN
    free: true
  astronaut:
    name: "&b우주인 헬멧"
    lore:
      - "&7숨은 쉴 수 있어요"
    material: GLASS
    rarity: rare
    price: 10000
  tnt_head:
    name: "&c폭탄 머리"
    lore:
      - "&7터지지는 않습니다"
    material: TNT
    price: 5000
  melon_head:
    name: "&a수박 머리"
    material: MELON
    price: 3000
  # 리소스팩/머리 텍스처 예시
  # custom_crown:
  #   name: "&e커스텀 왕관"
  #   material: PAPER
  #   custom-model-data: 1001
  # head_hat:
  #   name: "&d귀여운 머리"
  #   texture: "http://textures.minecraft.net/texture/<해시>"

# ── 백팩 : 등에 붙어 다니는 장식 (다른 사람도 보임, 텔레포트·탈것 방해 없음)
#   scale     크기 (기본 0.6)
#   offset-y  높이 조절
#   cycle     아이템 목록을 적으면 cycle-ticks 마다 번갈아 보여 줍니다
backpacks:
  chest_backpack:
    name: "&6보물 상자 가방"
