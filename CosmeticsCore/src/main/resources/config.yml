# ─────────────────────────────────────────────
#  CosmeticsCore 설정
#  코스메틱 목록은 cosmetics.yml, 문구는 messages.yml 에 있습니다.
#  고친 뒤 /cos reload 로 적용하세요 (storage 는 서버를 다시 켜야 바뀝니다).
# ─────────────────────────────────────────────

# 플레이어 데이터 저장 방식
#   YAML   : plugins/CosmeticsCore/data/<uuid>.yml (기본, 서버 한 대)
#   SQLITE : plugins/CosmeticsCore/data.db (파일 하나)
#   MYSQL  : MySQL/MariaDB (번지코드/벨로시티로 서버 여러 대가 같이 쓸 때)
# YAML 에서 SQLITE/MYSQL 로 바꿨다면 서버를 켠 뒤 /cos 이전 으로 기존 데이터를 옮기세요.
storage:
  type: YAML
  table: cosmeticscore_players
  # 로그인할 때 데이터를 읽기 전에 기다릴 시간(ms). 서버를 옮길 때 이전 서버의 저장이 먼저 끝나게 합니다
  # (적지 않으면 MYSQL 은 300, 나머지는 0)
  # login-delay-ms: 300
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    properties: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

# 코스메틱이 전부 꺼지는 월드 (모자·장식·파티클·궤적·킬 이펙트가 안 나옵니다. 칭호·채팅 색은 그대로)
disabled-worlds: []
#  - pvp_arena

particles:
  # 파티클을 몇 틱마다 그릴지 (20틱 = 1초). 낮을수록 부드럽지만 패킷이 늘어납니다
  interval-ticks: 2
  # 이 거리(블록) 안에 있는 플레이어에게만 보냅니다
  view-distance: 32
  # 투명화(포션 포함)·관전자·바니시 상태면 효과와 장식을 숨깁니다
  hide-when-invisible: true

arrow-trails:
  # 화살이 날아가는 동안 궤적을 그리는 최대 시간 (틱)
  max-ticks: 200

kill-effects:
  # true 면 몹을 잡았을 때도 킬 이펙트가 나옵니다
  include-mobs: false

hats:
  # 모자를 쓸 때 투구를 끼고 있으면 인벤토리로 옮겨 줍니다 (false 면 투구를 먼저 벗으라고 안내)
  move-helmet-to-inventory: true

titles:
  # 채팅 앞에 칭호를 붙입니다. 다른 채팅 플러그인과 겹치면 끄고
  # PlaceholderAPI 의 %cosmeticscore_title% 을 쓰세요
  chat: true
  # 탭 목록 이름 앞에 칭호를 붙입니다 (TAB 같은 플러그인을 쓰면 끄세요)
  tab-list: true

messages:
  # 입장 효과의 입장/퇴장 메시지·소리·폭죽
  join-effects: true
  # 킬 메시지 (게임 규칙 showDeathMessages 가 켜져 있어야 보입니다)
  kill-messages: true

preview:
  enabled: true
  # 메뉴에서 우클릭하면 잠긴 코스메틱도 이 시간(초) 동안 입어 볼 수 있습니다
  # (모자·백팩·풍선·펫·파티클. 칭호·채팅 색·메시지는 본인에게만 예시를 보여 줍니다)
  seconds: 10
  # 잠긴 코스메틱을 다시 미리 보려면 기다려야 하는 시간(초). 계속 미리보기로 공짜로 쓰는 것을 막습니다
  cooldown-seconds: 30

# 옷장 (/cos 옷장, 메인 메뉴의 갑옷 거치대)
#   본인에게만 보이는 마네킹에 코스메틱을 입혀 보며 고릅니다. 날개·꼬리처럼 등 뒤 장식도 한눈에 보입니다
#   1.21.9 이상은 내 스킨을 입은 마네킹, 그 아래 버전은 내 머리와 갑옷을 입은 갑옷 거치대가 섭니다
wardrobe:
  enabled: true
  # 플레이어와 마네킹 사이 거리 (칸, 2~5)
  distance: 2.8
  # 옷장을 열어 둘 수 있는 최대 시간 (초, 0 이면 제한 없음)
  max-seconds: 300
  # 옷장 자리. 비워 두면 각자 서 있는 곳에서 엽니다 (앞쪽 3칸이 비어 있어야 함)
  # 관리자가 /cos 옷장 설정 으로 정하면 여기에 "월드,x,y,z,방향,0" 으로 저장되고,
  # 옷장을 열 때 이 자리로 옮겨 갔다가 닫으면 원래 자리로 돌아옵니다
  location: ""

# 코스메틱 3D 모델 리소스팩
#   켤 때마다 plugins/CosmeticsCore/resourcepack/CosmeticsCore-pack.zip 을 만듭니다
#   (플러그인에 들어 있는 날개·꼬리·모자 등 모델 + resourcepack/extra/ 에 넣은 파일)
#   리소스팩이 없으면 그 코스메틱은 원래 아이템 모양(깃털, 종이 등)으로 보입니다
#   ItemsAdder·Nexo·Oraxen 을 쓰면 zip 안의 assets 폴더를 그 플러그인 리소스팩에 합쳐도 됩니다
resource-pack:
  # 접속한 플레이어에게 리소스팩을 보낼지
  send: false
  # true 면 리소스팩을 거절한 플레이어는 서버에서 나가게 됩니다
  required: false
  prompt: "&e코스메틱 3D 모델(날개, 꼬리, 모자)을 보려면 리소스팩을 받아 주세요!"
  # 리소스팩을 직접 올린 주소 (드롭박스·깃허브 등). 비워 두면 아래 self-host 로 플러그인이 직접 보냅니다
  url: ""
  self-host:
    enabled: true
    # 이 포트로 리소스팩 파일 하나만 내보냅니다 (방화벽/호스팅에서 열어 주세요)
    port: 8163
    # 플레이어가 리소스팩을 받을 서버 주소 (공인 IP 나 도메인, 예: play.myserver.com)
    # 비우면 server.properties 의 server-ip 를 씁니다
    address: ""

# 코스메틱 뽑기 (/cos 뽑기, 메인 메뉴의 엔더 상자)
#   열쇠(/cos 열쇠 <플레이어> <개수>)가 있으면 열쇠를 쓰고, 없으면 price 만큼 돈을 냅니다 (Vault 필요)
#   아직 없는 코스메틱만 나오며, 먼저 등급을 rarities 의 weight 로 고른 뒤 그 등급 안에서 고릅니다
crate:
  enabled: true
  # 0 이면 돈으로는 못 열고 열쇠로만 엽니다
  price: 0
  # 이 등급이 나오면 서버 전체에 알립니다
  broadcast-rarities:
    - legendary

# 등급: 이름(메뉴에 표시)과 뽑기 가중치. cosmetics.yml 에서 rarity: epic 처럼 씁니다 (기본 common)
rarities:
  common:
    name: "&7일반"
    weight: 60
  rare:
    name: "&9희귀"
    weight: 25
  epic:
    name: "&5영웅"
    weight: 10
  legendary:
    name: "&6&l전설"
    weight: 5

menu:
  # 잠긴 코스메틱도 메뉴에 보여줄지
  show-locked: true
  # 잠긴 코스메틱을 표시할 아이템 (비워 두면 원래 아이콘 그대로)
  locked-icon: GRAY_DYE
  # 메뉴 빈칸을 채우는 아이템 (비워 두면 빈칸)
  filler: GRAY_STAINED_GLASS_PANE
  # 메인 메뉴(6줄, 0~53번 칸)의 카테고리 버튼 위치와 아이콘
  # 4번(내 정보), 38번(옷장), 42번(뽑기), 48번(보기 설정), 50번(모두 해제)은 비워 두세요
  categories:
    hat:
      slot: 10
      icon: LEATHER_HELMET
    wings:
      slot: 11
      icon: ELYTRA
    backpack:
      slot: 12
      icon: CHEST
    tail:
      slot: 13
      icon: RABBIT_FOOT
    waist:
      slot: 14
      icon: LEATHER_LEGGINGS
    torso:
      slot: 15
      icon: LEATHER_CHESTPLATE
    balloon:
      slot: 16
      icon: LEAD
    pet:
      slot: 19
      icon: BONE
    particle:
      slot: 20
      icon: BLAZE_POWDER
    arrow_trail:
      slot: 21
      icon: ARROW
    kill_effect:
      slot: 22
      icon: DIAMOND_SWORD
    kill_message:
      slot: 23
      icon: WRITABLE_BOOK
    title:
      slot: 24
      icon: NAME_TAG
    chat_color:
      slot: 25
      icon: MAGENTA_DYE
    join_effect:
      slot: 31
      icon: OAK_DOOR
