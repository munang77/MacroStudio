# ─────────────────────────────────────────────
#  CosmeticsCore 설정
#  코스메틱 목록은 cosmetics.yml, 문구는 messages.yml 에 있습니다.
#  고친 뒤 /cos reload 로 적용하세요 (storage 는 서버를 다시 켜야 바뀝니다).
# ─────────────────────────────────────────────

# 플레이어 데이터 저장 방식
#   YAML   : plugins/CosmeticsCore/data/<uuid>.yml (기본, 서버 한 대)
#   SQLITE : plugins/CosmeticsCore/data.db (파일 하나)
#   MYSQL  : MySQL/MariaDB (번지코드/벨로시티로 서버 여러 대가 같이 쓸 때)
# YAML 에서 SQLITE/MYSQL 로 바꿨다면 서버를 켠 뒤 /cos 이전 으로 기존 데이터를 옮기세요.
storage:
  type: YAML
  table: cosmeticscore_players
  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    properties: "useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8"

# 코스메틱이 전부 꺼지는 월드 (모자·장식·파티클·궤적·킬 이펙트가 안 나옵니다. 칭호·채팅 색은 그대로)
disabled-worlds: []
#  - pvp_arena

particles:
  # 파티클을 몇 틱마다 그릴지 (20틱 = 1초). 낮을수록 부드럽지만 패킷이 늘어납니다
  interval-ticks: 2
  # 이 거리(블록) 안에 있는 플레이어에게만 보냅니다
  view-distance: 32
  # 투명화(포션 포함)·관전자·바니시 상태면 효과와 장식을 숨깁니다
  hide-when-invisible: true

arrow-trails:
  # 화살이 날아가는 동안 궤적을 그리는 최대 시간 (틱)
  max-ticks: 200

kill-effects:
  # true 면 몹을 잡았을 때도 킬 이펙트가 나옵니다
  include-mobs: false

hats:
  # 모자를 쓸 때 투구를 끼고 있으면 인벤토리로 옮겨 줍니다 (false 면 투구를 먼저 벗으라고 안내)
  move-helmet-to-inventory: true

titles:
  # 채팅 앞에 칭호를 붙입니다. 다른 채팅 플러그인과 겹치면 끄고
  # PlaceholderAPI 의 %cosmeticscore_title% 을 쓰세요
  chat: true
  # 탭 목록 이름 앞에 칭호를 붙입니다 (TAB 같은 플러그인을 쓰면 끄세요)
  tab-list: true

messages:
  # 입장 효과의 입장/퇴장 메시지·소리·폭죽
  join-effects: true
  # 킬 메시지 (게임 규칙 showDeathMessages 가 켜져 있어야 보입니다)
  kill-messages: true

preview:
  # 메뉴에서 우클릭하면 잠긴 코스메틱도 이 시간(초) 동안 입어 볼 수 있습니다
  seconds: 10

# 코스메틱 뽑기 (/cos 뽑기, 메인 메뉴 가운데 상자)
#   열쇠(/cos 열쇠 <플레이어> <개수>)가 있으면 열쇠를 쓰고, 없으면 price 만큼 돈을 냅니다 (Vault 필요)
#   아직 없는 코스메틱만 나오며, 먼저 등급을 rarities 의 weight 로 고른 뒤 그 등급 안에서 고릅니다
crate:
  enabled: true
  # 0 이면 돈으로는 못 열고 열쇠로만 엽니다
  price: 0
  # 이 등급이 나오면 서버 전체에 알립니다
  broadcast-rarities:
    - legendary

# 등급: 이름(메뉴에 표시)과 뽑기 가중치. cosmetics.yml 에서 rarity: epic 처럼 씁니다 (기본 common)
rarities:
  common:
    name: "&7일반"
    weight: 60
  rare:
    name: "&9희귀"
    weight: 25
  epic:
    name: "&5영웅"
    weight: 10
  legendary:
    name: "&6&l전설"
    weight: 5

menu:
  # 잠긴 코스메틱도 메뉴에 보여줄지
  show-locked: true
  # 잠긴 코스메틱을 표시할 아이템 (비워 두면 원래 아이콘 그대로)
  locked-icon: GRAY_DYE
  # 메뉴 빈칸을 채우는 아이템 (비워 두면 빈칸)
  filler: GRAY_STAINED_GLASS_PANE
  # 메인 메뉴(5줄, 0~44번 칸)의 카테고리 버튼 위치와 아이콘
  # 4번(내 정보), 22번(뽑기), 39번(보기 설정), 41번(모두 해제)은 비워 두세요
  categories:
    hat:
      slot: 10
      icon: LEATHER_HELMET
    backpack:
      slot: 11
      icon: CHEST
    balloon:
      slot: 12
      icon: LEAD
    pet:
      slot: 13
      icon: BONE
    particle:
      slot: 14
      icon: BLAZE_POWDER
    arrow_trail:
      slot: 15
      icon: ARROW
    kill_effect:
      slot: 16
      icon: DIAMOND_SWORD
    kill_message:
      slot: 20
      icon: WRITABLE_BOOK
    title:
      slot: 21
      icon: NAME_TAG
    chat_color:
      slot: 23
      icon: MAGENTA_DYE
    join_effect:
      slot: 24
      icon: OAK_DOOR
